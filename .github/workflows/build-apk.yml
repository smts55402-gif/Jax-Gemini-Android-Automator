name: Build Jax APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Find and extract Jax ZIP
        shell: bash
        run: |
          set -e

          mkdir -p jax-source

          ARCHIVE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: No Jax ZIP file found in repository root."
            exit 1
          fi

          echo "Using archive: $ARCHIVE"

          unzip -q "$ARCHIVE" -d jax-source

          echo "Extracted files:"
          find jax-source -maxdepth 3 -type f | head -100

          if [ ! -f "jax-source/app/build.gradle" ] && [ ! -f "jax-source/app/build.gradle.kts" ]; then
            echo "ERROR: Android app folder was not found after extraction."
            echo "Repository ZIP structure is incorrect."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build Jax APK
        working-directory: jax-source
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload Jax APK
        uses: actions/upload-artifact@v4
        with:
          name: Jax-Gemini-Android-Automator-debug
          path: jax-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
